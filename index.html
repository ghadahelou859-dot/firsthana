<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ليلة حنة رأفت ورنين</title>

<style>

:root{
    --cream:#f8efe2;
    --cream-light:#fffaf3;
    --burgundy:#751824;
    --gold:#c69a50;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Tahoma, Arial, sans-serif;
    background:var(--cream);
    color:var(--burgundy);
}

button{
    font-family:inherit;
}

/* =========================
   GENERAL PAGE
========================= */

.page{
    width:100%;
    min-height:100svh;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    overflow:hidden;

    background:
      radial-gradient(
        circle at 50% 25%,
        rgba(255,255,255,.95),
        transparent 45%
      ),
      linear-gradient(
        180deg,
        #fffaf3 0%,
        #f5e9d8 100%
      );
}

/* =========================
   PAGE 1 - ENVELOPE
========================= */

#cover{
    flex-direction:column;
}

.envelope-stage{
    width:min(94vw,760px);
    height:min(78svh,610px);

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.envelope-crop{
    width:min(92vw,700px);

    aspect-ratio:1.48 / 1;

    overflow:hidden;

    position:absolute;

    display:flex;
    align-items:center;
    justify-content:center;

    filter:
      drop-shadow(
        0 18px 30px
        rgba(75,45,25,.18)
      );

    transition:
      opacity .8s ease,
      transform 1s ease;
}

.envelope-crop img{
    width:112%;
    height:112%;

    object-fit:cover;

    display:block;
}

/* الظرف المغلق */

.closed-wrap{
    z-index:5;
}

/* الظرف المفتوح */

.open-wrap{
    z-index:2;

    opacity:0;

    transform:
      translateY(30px)
      scale(.95);
}

/* بعد الفتح */

.envelope-stage.opened .closed-wrap{
    opacity:0;

    transform:
      translateY(75px)
      scale(.88);
}

.envelope-stage.opened .open-wrap{
    opacity:1;

    transform:
      translateY(0)
      scale(1);
}

/* نص فتح الظرف */

.open-message{
    position:absolute;

    bottom:5%;

    color:var(--burgundy);

    font-size:
      clamp(15px,3.8vw,20px);

    animation:pulse 1.6s infinite;

    text-align:center;

    z-index:10;
}

@keyframes pulse{

    0%,100%{
        opacity:.55;
        transform:translateY(0);
    }

    50%{
        opacity:1;
        transform:translateY(-4px);
    }
}

/* =========================
   BUTTONS
========================= */

.next-btn,
.map-btn,
.music-btn{

    border:none;

    background:
      linear-gradient(
        135deg,
        #801c2a,
        #5d101b
      );

    color:white;

    padding:13px 25px;

    border-radius:999px;

    font-size:15px;

    cursor:pointer;

    box-shadow:
      0 8px 22px
      rgba(100,20,30,.20);
}

.next-btn{
    position:absolute;

    bottom:20px;

    left:50%;

    transform:
      translateX(-50%);

    z-index:20;
}

/* زر الموسيقى */

.music-btn{
    position:fixed;

    top:16px;
    right:16px;

    width:46px;
    height:46px;

    padding:0;

    border-radius:50%;

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
}

/* =========================
   PAGE 2 - INVITATION
========================= */

#invitationPage{
    padding:0;
}

.invitation-image{

    display:block;

    width:auto;
    max-width:100%;

    height:100svh;

    object-fit:contain;
}

/* =========================
   PAGE 3 - DANCE
========================= */

#dance{

    background:
      radial-gradient(
        circle at center,
        #fffdf9 0%,
        #f8efe2 55%,
        #eddcc5 100%
      );
}

.dance-container{

    width:100%;
    height:100svh;

    display:flex;

    justify-content:center;
    align-items:center;

    position:relative;
}

.dance-title{

    position:absolute;

    top:28px;

    z-index:5;

    width:100%;

    text-align:center;

    color:var(--burgundy);

    font-size:
      clamp(27px,6vw,44px);

    font-weight:700;
}

#dancer{

    width:min(86vw,570px);

    height:80svh;

    object-fit:contain;

    user-select:none;

    pointer-events:none;
}

/* =========================
   PAGE 4 - COUNTDOWN
========================= */

#location{

    min-height:100svh;

    flex-direction:column;

    justify-content:flex-start;

    padding:
      40px 15px 55px;
}

.section-title{

    margin:
      5px 0 25px;

    font-size:
      clamp(30px,6vw,48px);

    color:var(--burgundy);

    text-align:center;
}

.gold-line{

    width:90px;
    height:1px;

    background:
      linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
      );

    margin:
      -12px auto 25px;
}

/* العد الحقيقي */

.timer{

    width:min(94vw,700px);

    display:grid;

    grid-template-columns:
      repeat(4,1fr);

    gap:12px;

    direction:rtl;

    margin-bottom:30px;
}

.time-box{

    background:
      rgba(255,250,243,.96);

    border:
      1.5px solid
      rgba(198,154,80,.75);

    border-radius:18px;

    padding:
      15px 4px;

    text-align:center;

    box-shadow:
      0 7px 20px
      rgba(80,45,25,.06);
}

.time-box strong{

    display:block;

    color:var(--burgundy);

    font-family:
      Georgia,
      "Times New Roman",
      serif;

    font-size:
      clamp(29px,6vw,50px);

    line-height:1;
}

.time-box span{

    display:block;

    margin-top:7px;

    color:var(--burgundy);

    font-size:
      clamp(12px,3vw,17px);
}

/* =========================
   LOCATION
========================= */

.location-title{

    font-size:
      clamp(25px,5vw,38px);

    margin:
      5px 0 15px;

    color:var(--burgundy);
}

/* نقص الجزء العلوي من countdown.png
   حتى ما يظهر العد الموجود داخل الصورة */

.location-crop{

    width:min(94vw,820px);

    aspect-ratio:2.1 / 1;

    overflow:hidden;

    border-radius:18px;

    position:relative;

    background:#f7ead8;

    border:
      1px solid
      rgba(198,154,80,.45);

    box-shadow:
      0 10px 28px
      rgba(75,40,20,.10);
}

.location-crop img{

    width:100%;
    height:auto;

    position:absolute;

    left:0;

    top:-46%;

    display:block;
}

.map-btn{

    margin-top:24px;

    min-width:220px;

    font-size:16px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .envelope-stage{
        height:560px;
    }

    .envelope-crop{
        width:94vw;
    }

    .timer{
        gap:6px;
    }

    .time-box{
        padding:
          11px 2px;

        border-radius:13px;
    }

    .location-crop{
        width:96vw;

        aspect-ratio:1.65 / 1;
    }

    .location-crop img{
        top:-35%;
    }

}

</style>
</head>

<body>

<!-- =========================
     MUSIC
========================= -->

<audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
</audio>

<button
class="music-btn"
id="musicButton"
onclick="toggleMusic()">
🔊
</button>

<!-- =========================
     PAGE 1 - ENVELOPE
========================= -->

<section class="page" id="cover">

<div
class="envelope-stage"
id="envelopeStage">

<!-- الظرف المفتوح -->

<div class="envelope-crop open-wrap">
    <img
    src="envelope-open.png"
    alt="الظرف المفتوح">
</div>

<!-- الظرف المغلق -->

<div class="envelope-crop closed-wrap">
    <img
    src="envelope-closed.png"
    alt="افتحي الدعوة">
</div>

<div
class="open-message"
id="openMessage">

اضغطي على الظرف لفتح الدعوة ✨

</div>

</div>

<button
class="next-btn"
id="inviteButton"
style="display:none"
onclick="goToPage('invitationPage')">

انزلي للدعوة ↓

</button>

</section>

<!-- =========================
     PAGE 2 - INVITATION
========================= -->

<section
class="page"
id="invitationPage">

<img
src="invitation.png"
class="invitation-image"
alt="دعوة ليلة الحنة">

<button
class="next-btn"
onclick="goToPage('dance')">

شوفي الرقصة ↓

</button>

</section>

<!-- =========================
     PAGE 3 - DANCE
========================= -->

<section
class="page"
id="dance">

<div
class="dance-container">

<h2
class="dance-title">

ليلة الحنّة ✨

</h2>

<img
src="girl1.png"
id="dancer"
alt="رقصة فلسطينية">

</div>

<button
class="next-btn"
onclick="goToPage('location')">

العد التنازلي والموقع ↓

</button>

</section>

<!-- =========================
     PAGE 4 - COUNTDOWN
========================= -->

<section
class="page"
id="location">

<h1 class="section-title">

العد التنازلي للحنّة

</h1>

<div class="gold-line"></div>

<div class="timer">

<div class="time-box">
<strong id="days">0</strong>
<span>يوم</span>
</div>

<div class="time-box">
<strong id="hours">00</strong>
<span>ساعة</span>
</div>

<div class="time-box">
<strong id="minutes">00</strong>
<span>دقيقة</span>
</div>

<div class="time-box">
<strong id="seconds">00</strong>
<span>ثانية</span>
</div>

</div>

<h2 class="location-title">

موقع الحنّة

</h2>

<div class="gold-line"></div>

<div class="location-crop">

<img
src="countdown.png"
alt="موقع الحنة">

</div>

<button
class="map-btn"
onclick="openMap()">

📍 افتحي الموقع على الخريطة

</button>

</section>

<script>

/* =========================
   ALWAYS START AT TOP
========================= */

history.scrollRestoration = "manual";

window.addEventListener(
"load",
function(){

    window.scrollTo(0,0);

    document
    .getElementById("cover")
    .scrollIntoView({
        behavior:"auto"
    });

}
);

/* =========================
   NAVIGATION
========================= */

function goToPage(id){

    document
    .getElementById(id)
    .scrollIntoView({
        behavior:"smooth"
    });

}

/* =========================
   MUSIC
========================= */

const bgMusic =
document.getElementById(
    "bgMusic"
);

const musicButton =
document.getElementById(
    "musicButton"
);

let musicStarted=false;

function startMusic(){

    bgMusic
    .play()
    .then(function(){

        musicStarted=true;

        musicButton
        .textContent="🔊";

    })
    .catch(function(){

        console.log(
            "Audio blocked"
        );

    });

}

function toggleMusic(){

    if(bgMusic.paused){

        bgMusic.play();

        musicButton
        .textContent="🔊";

    }

    else{

        bgMusic.pause();

        musicButton
        .textContent="🔇";

    }

}

/* =========================
   OPEN ENVELOPE
========================= */

const envelopeStage =
document.getElementById(
    "envelopeStage"
);

const openMessage =
document.getElementById(
    "openMessage"
);

const inviteButton =
document.getElementById(
    "inviteButton"
);

let envelopeOpened=false;

function openEnvelope(){

    if(envelopeOpened){
        return;
    }

    envelopeOpened=true;

    envelopeStage
    .classList
    .add("opened");

    openMessage
    .style
    .display="none";

    /* الموسيقى تبدأ مع أول ضغطة */

    if(!musicStarted){

        startMusic();

    }

    /* يظهر زر النزول بعد فتح الظرف */

    setTimeout(
        function(){

            inviteButton
            .style
            .display="block";

        },
        900
    );

}

/* الضغط على كامل الظرف */

envelopeStage
.addEventListener(
    "click",
    openEnvelope
);

/* دعم الموبايل */

envelopeStage
.addEventListener(
    "touchend",
    function(event){

        event.preventDefault();

        openEnvelope();

    },
    {
        passive:false
    }
);

/* =========================
   GIRL DANCE
========================= */

const dancer =
document.getElementById(
    "dancer"
);

const frames=[

    "girl1.png",
    "girl2.png",
    "girl3.png",
    "girl4.png",
    "girl3.png",
    "girl2.png"

];

/* تحميل مسبق */

frames.forEach(
function(src){

    const image =
    new Image();

    image.src =
    src;

}
);

let frameIndex=0;

setInterval(
function(){

    frameIndex =
      (frameIndex+1)
      %
      frames.length;

    dancer.src =
      frames[
        frameIndex
      ];

},
380
);

/* =========================
   COUNTDOWN
========================= */

const eventDate =
new Date(
    "2027-07-07T19:00:00+03:00"
)
.getTime();

function updateCountdown(){

    let distance =
      eventDate
      -
      Date.now();

    if(distance<0){

        distance=0;

    }

    const days =
      Math.floor(
        distance
        /
        86400000
      );

    const hours =
      Math.floor(
        (
          distance
          %
          86400000
        )
        /
        3600000
      );

    const minutes =
      Math.floor(
        (
          distance
          %
          3600000
        )
        /
        60000
      );

    const seconds =
      Math.floor(
        (
          distance
          %
          60000
        )
        /
        1000
      );

    document
    .getElementById(
        "days"
    )
    .textContent =
      days;

    document
    .getElementById(
        "hours"
    )
    .textContent =
      String(hours)
      .padStart(
        2,
        "0"
      );

    document
    .getElementById(
        "minutes"
    )
    .textContent =
      String(minutes)
      .padStart(
        2,
        "0"
      );

    document
    .getElementById(
        "seconds"
    )
    .textContent =
      String(seconds)
      .padStart(
        2,
        "0"
      );

}

updateCountdown();

setInterval(
    updateCountdown,
    1000
);

/* =========================
   GOOGLE MAPS
========================= */

function openMap(){

    window.open(

        "https://maps.app.goo.gl/MucwsVVYP3ixZqaX6",

        "_blank"

    );

}

</script>

</body>

</html>
