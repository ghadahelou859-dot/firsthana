<section id="videoPage">

  <video
    id="coverVideo"
    src="envelope.mp4"
    playsinline
    preload="auto"
  ></video>

  <div id="tapText">
    اضغطي على الفيديو لفتح الدعوة ✨
  </div>

</section>

<style>

#videoPage{
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  background:#f8efe2;
  cursor:pointer;
  overflow:hidden;
}

#coverVideo{
  width:min(94vw,600px);
  max-height:88vh;
  object-fit:contain;
  display:block;
  border-radius:18px;
  background:#000;
}

#tapText{
  position:absolute;
  bottom:28px;
  width:100%;
  text-align:center;
  color:#741b27;
  font-size:18px;
  font-family:Tahoma,Arial,sans-serif;
  animation:pulse 1.5s infinite;
  pointer-events:none;
}

@keyframes pulse{
  0%,100%{opacity:.55;}
  50%{opacity:1;}
}

</style>

<script>

const videoPage = document.getElementById("videoPage");
const coverVideo = document.getElementById("coverVideo");
const tapText = document.getElementById("tapText");

let started = false;

function playEnvelopeVideo(){

  if(started) return;

  started = true;

  tapText.style.display = "none";

  coverVideo.currentTime = 0;

  coverVideo.play()
  .catch(function(){
    started = false;
    tapText.style.display = "block";
  });
}

videoPage.addEventListener("click", playEnvelopeVideo);

coverVideo.addEventListener("ended", function(){

  document
    .getElementById("invitationPage")
    .scrollIntoView({
      behavior:"smooth"
    });

});

</script>
