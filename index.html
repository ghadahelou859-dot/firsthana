<!-- ===== فيديو فتح الدعوة ===== -->

<section id="videoPage">

  <video
    id="coverVideo"
    src="envelope.mp4"
    playsinline
    preload="auto">
  </video>

  <div id="tapText">
    اضغطي على الكرت لفتح الدعوة ✨
  </div>

</section>


<style>

#videoPage{
  width:100%;
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  position:relative;

  background:#f8efe2;

  cursor:pointer;

  overflow:hidden;
}

#coverVideo{
  width:min(95vw,600px);
  max-height:90vh;

  object-fit:contain;

  border-radius:18px;

  display:block;
}

#tapText{
  position:absolute;

  bottom:25px;

  width:100%;

  text-align:center;

  color:#741b27;

  font-family:Tahoma,Arial,sans-serif;

  font-size:18px;

  animation:pulse 1.5s infinite;

  pointer-events:none;
}

@keyframes pulse{

  0%,100%{
    opacity:.55;
  }

  50%{
    opacity:1;
  }

}

</style>


<script>

const videoPage =
document.getElementById("videoPage");

const coverVideo =
document.getElementById("coverVideo");

const tapText =
document.getElementById("tapText");

let videoStarted = false;


/* عند الضغط على الكرت يبدأ الفيديو */

function startVideo(){

  if(videoStarted){
    return;
  }

  videoStarted = true;

  tapText.style.display = "none";

  coverVideo.currentTime = 0;

  coverVideo.play()
  .catch(function(){

    videoStarted = false;

    tapText.style.display = "block";

  });

}


/* كمبيوتر */

videoPage.addEventListener(
  "click",
  startVideo
);


/* موبايل */

videoPage.addEventListener(
  "touchend",
  function(event){

    event.preventDefault();

    startVideo();

  },
  { passive:false }
);


/* لما يخلص الفيديو ينتقل للكرت */

coverVideo.addEventListener(
  "ended",
  function(){

    const nextPage =
    document.getElementById("invitationPage");

    if(nextPage){

      nextPage.scrollIntoView({
        behavior:"smooth"
      });

    }

  }
);

</script>
